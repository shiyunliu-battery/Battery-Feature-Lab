name: Publish Python package

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release version and changelog
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_REF"] == f"refs/tags/v{version}", "Tag does not match package version"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert re.search(rf"^## {re.escape(version)}\b", changelog, re.M), "CHANGELOG.md has no section for this version"
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,eis]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/battery-feature-lab
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  create-release:
    name: Create GitHub release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract release notes from the changelog
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          Path("release-notes.md").write_text(section.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Battery Feature Lab ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
