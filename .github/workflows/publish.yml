name: Publish Python package

permissions:
  contents: read

on:
  push:
    branches:
      - "release/*"
      - "prepare/*"
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/"):
              assert ref == f"refs/tags/v{version}", "Tag does not match package version"
          elif ref.startswith("refs/heads/release/"):
              assert ref == f"refs/heads/release/{version}", "Release branch does not match package version"
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,eis]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/battery-feature-lab
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  create-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="${GITHUB_REF#refs/heads/release/}"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Battery Feature Lab ${RELEASE_VERSION}" \
            --notes-file CHANGELOG.md
