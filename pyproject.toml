[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-feature-lab"
version = "0.4.0"
description = "Auditable battery time-series analysis over BDS and formal BDF handoffs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "BFL contributors" }]
dependencies = [
  "battery-data-standard>=0.3.1,<0.4",
  "jsonschema>=4.26",
  "numpy>=1.26.4",
  "polars>=1.18",
  "PyProBE-Data>=2.6,<2.7",
  "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
bdf = ["batterydf==0.1.0"]
ai = ["openai>=2,<3"]

[project.scripts]
bfl = "battery_feature_lab.cli:main"

[tool.setuptools.packages.find]
include = ["battery_feature_lab*", "bfl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
